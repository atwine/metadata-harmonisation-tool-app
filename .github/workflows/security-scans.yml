# Security scans on every push and pull request, and weekly so newly
# published library holes show up even when nobody pushes.
# Installed by the security-scans skill. Delete a job your project doesn't need.
name: security-scans

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets in the code and its history (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          tarball="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfLO "$base/gitleaks_${VERSION}_checksums.txt"
          grep " $tarball\$" "gitleaks_${VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
      - name: Scan every commit
        run: ./gitleaks git --redact --verbose .

  python-deps:
    name: Python libraries with known holes (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Audit every requirements file
        run: |
          pip install pip-audit==2.10.1
          files=$(git ls-files '*requirements*.txt')
          if [ -z "$files" ]; then echo "No requirements files."; exit 0; fi
          status=0
          for f in $files; do
            echo "::group::$f"
            pip-audit --progress-spinner off -r "$f" || status=1
            echo "::endgroup::"
          done
          exit $status

  node-deps:
    name: JavaScript libraries with known holes (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # OWNER-APPROVED EXCEPTION (decision D7, 2026-10-08): the first run found 22
    # problems (1 critical, 16 high) that come from the build and dev tooling
    # (vite, TanStack Start, wrangler/miniflare, undici, ws) which package.json
    # lists under "dependencies". This job still runs and prints every finding,
    # but does not turn the run red. Remove "continue-on-error" once the
    # packages are updated (follow-up: update the JavaScript packages, then
    # re-run the full upload, initialise, map and download flow).
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Audit package-lock.json (high and critical fail this job, see exception above)
        run: |
          if [ ! -f package-lock.json ]; then echo "No package-lock.json."; exit 0; fi
          npm audit --audit-level=high --omit=dev

  code:
    name: Risky code patterns (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # PENDING OWNER DECISION (item 6 triage, 2026-10-08): the first run found 6
    # items. Fixed: 3 unpinned actions in publish-main-images.yml (now pinned to
    # commit hashes) and 1 false alarm in backend/storage/db.py (nosemgrep, with
    # reason). Decided by the owner on 2026-10-08: (1) backend/Dockerfile has no
    # USER line, so Semgrep reports dockerfile.security.missing-user and
    # missing-user-entrypoint (two findings). ACCEPTED AS A FALSE ALARM: the
    # container starts as root only to fix the ownership of the mounted data
    # folders, then docker/backend-entrypoint.sh runs the app through gosu as an
    # ordinary user (the folder owner, or 10001). Tested with real containers: the
    # app process ran as 10001 or 1000, never root. A plain USER line would break
    # Linux installs, because Docker creates the data folders owned by root.
    # Still open, owner to decide, and the reason this job does not fail the run:
    # (2) bunfig.toml minimumReleaseAge is 1 day, the rule wants 7 days (a security
    # policy the owner must change, not Devin). Remove "continue-on-error" once
    # (2) is decided.
    continue-on-error: true
    container:
      image: semgrep/semgrep:1.179.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan with the default rule set
        run: semgrep scan --config p/default --error --metrics off
